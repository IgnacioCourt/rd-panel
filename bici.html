<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruta para Dani</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#faf7f2; --surface:#ffffff; --surface-2:#f2ede4; --ink:#2b2620; --ink-soft:#5c554a;
  --muted:#8f8679; --line:#e5ddd0; --accent:#c1502c; --accent-ink:#ffffff; --accent2:#1f6f6b;
  --good:#2f7a3e; --good-bg:rgba(47,122,62,.12); --warn:#a8741c; --warn-bg:rgba(182,132,42,.14);
  --bad:#a63a2a; --bad-bg:rgba(166,58,42,.10);
  --shadow:0 1px 2px rgba(43,38,32,.06), 0 8px 24px -12px rgba(43,38,32,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1712; --surface:#242019; --surface-2:#2c261e; --ink:#f1ece2; --ink-soft:#c9bfae;
    --muted:#958b7c; --line:#3a3327; --accent:#e37350; --accent-ink:#241206; --accent2:#4fada7;
    --good:#6cbf76; --good-bg:rgba(108,191,118,.14); --warn:#d9a441; --warn-bg:rgba(217,164,65,.14);
    --bad:#e2826f; --bad-bg:rgba(226,130,111,.12);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#1b1712; --surface:#242019; --surface-2:#2c261e; --ink:#f1ece2; --ink-soft:#c9bfae;
  --muted:#958b7c; --line:#3a3327; --accent:#e37350; --accent-ink:#241206; --accent2:#4fada7;
  --good:#6cbf76; --good-bg:rgba(108,191,118,.14); --warn:#d9a441; --warn-bg:rgba(217,164,65,.14);
  --bad:#e2826f; --bad-bg:rgba(226,130,111,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:'Public Sans',system-ui,-apple-system,Segoe UI,sans-serif; padding:28px 16px 120px}
h1,h2,h3{font-family:'Fraunces',Georgia,serif; text-wrap:balance; margin:0}
a{color:var(--accent2)}
.wrap{max-width:1240px; margin:0 auto; display:flex; flex-direction:column; gap:22px}
header{display:flex; flex-direction:column; gap:8px}
.eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent2); font-weight:700}
header h1{font-size:clamp(28px,4vw,40px); font-weight:600}
header p{margin:0; color:var(--ink-soft); font-size:15px; max-width:72ch; line-height:1.55}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow)}
.stat .num{font-family:'Fraunces',serif; font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--accent)}
.stat .lbl{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:2px}

.toolbar{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px); padding:10px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; border-bottom:1px solid var(--line)}
.search{flex:1 1 260px; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:0 12px; min-height:42px}
.search input{border:0; outline:0; background:transparent; color:var(--ink); font:inherit; font-size:15px; width:100%; padding:10px 0}
.search svg{flex-shrink:0; color:var(--muted)}
select,.btn{font:inherit; font-size:14px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:0 12px; min-height:42px; cursor:pointer}
.btn:hover,select:hover{border-color:var(--accent2)}
.btn[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
.btn.primary:disabled{opacity:.45; cursor:default}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden}
.seg button{border:0; border-radius:0; min-height:40px}
.seg button+button{border-left:1px solid var(--line)}

.filters{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px 22px}
.filters[hidden]{display:none}
.fg{display:flex; flex-direction:column; gap:7px}
.fg-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:1px solid var(--line); background:var(--surface-2); color:var(--ink-soft); padding:6px 11px; border-radius:999px; font:inherit; font-size:13px; cursor:pointer; min-height:32px}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.chip .n{opacity:.65; font-size:11.5px; margin-left:3px}
.pr{display:flex; gap:8px; align-items:center}
.pr input{width:100%; font:inherit; font-size:14px; background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 10px}
.toggles{display:flex; flex-direction:column; gap:6px; font-size:13.5px; color:var(--ink-soft)}
.toggles label{display:flex; gap:8px; align-items:center; cursor:pointer}
.toggles input{accent-color:var(--accent); width:16px; height:16px}
.count-line{font-size:13px; color:var(--muted)}

#cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--shadow); position:relative}
.card.sel{outline:2px solid var(--accent); outline-offset:-1px}
.ph{aspect-ratio:4/3; background:var(--surface-2); position:relative; overflow:hidden}
.ph img{width:100%; height:100%; object-fit:cover; display:block}
.ph .none{position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:12px}
.ph .tl{position:absolute; top:8px; left:8px; display:flex; gap:5px; flex-wrap:wrap}
.ph .tr{position:absolute; top:8px; right:8px; display:flex; gap:6px}
.pill{font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; background:rgba(20,16,12,.72); color:#fff; letter-spacing:.02em}
.pill.new{background:var(--accent2)}
.pill.drop{background:#2f7a3e}
.pill.res{background:#a8741c}
.icon-btn{width:34px; height:34px; border-radius:999px; border:0; background:rgba(255,255,255,.92); color:#2b2620; display:grid; place-items:center; cursor:pointer; font-size:16px; box-shadow:0 1px 4px rgba(0,0,0,.25)}
.icon-btn[aria-pressed="true"]{background:var(--accent); color:#fff}
.body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:9px; flex:1}
.row1{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
.card h3{font-size:16.5px; font-weight:600; line-height:1.3}
.brand{font-size:11.5px; color:var(--accent2); font-weight:700; text-transform:uppercase; letter-spacing:.05em}
.score{flex-shrink:0; text-align:center; cursor:help}
.score b{display:block; font-family:'Fraunces',serif; font-size:22px; line-height:1; color:var(--accent); font-variant-numeric:tabular-nums}
.score span{font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
.price{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.price .v{font-family:'Fraunces',serif; font-size:24px; font-weight:600; font-variant-numeric:tabular-nums}
.price s{color:var(--muted); font-size:14px}
.nuevo{font-size:12.5px; color:var(--ink-soft); cursor:help}
.nuevo b{font-variant-numeric:tabular-nums}
.nuevo .est{color:var(--muted)}
.badges{display:flex; flex-wrap:wrap; gap:5px}
.badge{font-size:11.5px; padding:3px 8px; border-radius:999px; font-weight:600; background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line)}
.badge.ok{background:var(--good-bg); color:var(--good); border-color:transparent}
.badge.mid{background:var(--warn-bg); color:var(--warn); border-color:transparent}
.badge.no{background:var(--bad-bg); color:var(--bad); border-color:transparent}
.meta{font-size:12.5px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 10px}
details.desc{font-size:13px; color:var(--ink-soft); line-height:1.5}
details.desc summary{cursor:pointer; color:var(--accent2); font-size:12.5px}
details.desc p{white-space:pre-line; margin:6px 0 0}
.actions{display:flex; gap:8px; margin-top:auto; padding-top:4px}
.actions a,.actions button{flex:1; text-align:center; font:inherit; font-size:13px; text-decoration:none; color:var(--accent2); border:1px solid var(--line); padding:8px 10px; border-radius:9px; background:var(--surface-2); cursor:pointer}
.actions a:hover,.actions button:hover{border-color:var(--accent2)}
.actions button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.more{display:flex; justify-content:center}
.empty{padding:40px; text-align:center; color:var(--muted); font-size:14px; background:var(--surface); border:1px dashed var(--line); border-radius:14px}

.tablewrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow)}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; vertical-align:middle}
th{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); cursor:pointer; user-select:none; position:sticky; top:0; background:var(--surface)}
th.num,td.num{text-align:right; font-variant-numeric:tabular-nums}
td.t{white-space:normal; min-width:220px; max-width:340px}
td.t a{color:var(--ink); text-decoration:none; font-weight:600}
td.t a:hover{color:var(--accent2)}
td img{width:56px; height:42px; object-fit:cover; border-radius:6px; display:block; background:var(--surface-2)}
tr.sel td{background:color-mix(in srgb, var(--accent) 8%, transparent)}

.cmp{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface); border-top:1px solid var(--line); box-shadow:0 -10px 30px -12px rgba(0,0,0,.3); max-height:78vh; display:flex; flex-direction:column}
.cmp[hidden]{display:none}
.cmp-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line)}
.cmp-head h2{font-size:17px}
.cmp-body{overflow:auto; padding:0 16px 16px}
.cmp table td,.cmp table th{white-space:normal; vertical-align:top; min-width:170px}
.cmp table th{position:static; cursor:default; width:120px; min-width:110px}
.cmp img{width:100%; max-width:220px; height:auto; aspect-ratio:4/3; object-fit:cover; border-radius:8px}
.best{color:var(--good); font-weight:700}

.side{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px}
.box{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); font-size:13.5px; color:var(--ink-soft); line-height:1.6}
.box h2{font-size:18px; color:var(--ink); margin-bottom:8px}
.box ul{margin:0; padding-left:18px}
.box li+li{margin-top:4px}
.sold li{color:var(--muted)}
.callout{background:linear-gradient(135deg,var(--accent2),#2d6b62); color:#fff; border-radius:16px; padding:20px 22px; display:flex; flex-direction:column; gap:8px}
.callout h2{font-size:19px; color:#fff}
.callout p,.callout ul{margin:0; font-size:13.5px; line-height:1.6; opacity:.95}
.callout ul{padding-left:18px}
footer{font-size:12px; color:var(--muted); text-align:center}
@media (max-width:640px){
  body{padding-top:18px}
  .toolbar .lbl-h{display:none}
  .stat .num{font-size:22px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="h1"></h1>
    <p id="intro"></p>
  </header>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar: defy, 105, disco, 52cm, carbono…" autocomplete="off" aria-label="Buscar avisos">
    </label>
    <select id="sort" aria-label="Ordenar">
      <option value="puntaje">Mejor opción</option>
      <option value="precio">Precio: menor a mayor</option>

      <option value="dias">Más recientes</option>
      <option value="bajada">Bajaron de precio</option>
    </select>
    <div class="seg" role="group" aria-label="Vista">
      <button class="btn" id="vCards" aria-pressed="true">Tarjetas</button>
      <button class="btn" id="vTable" aria-pressed="false">Tabla</button>
    </div>
    <button class="btn" id="tFilters" aria-expanded="true">Filtros</button>
    <button class="btn primary" id="openCmp" disabled>Comparar (0)</button>
  </div>

  <div class="filters" id="filters">
    <div class="fg"><span class="fg-label" id="lblTalla">Talla</span><div class="chips" id="fCalce"></div></div>
    <div class="fg"><span class="fg-label">Geometría</span><div class="chips" id="fGeo"></div></div>
    <div class="fg"><span class="fg-label">Frenos</span><div class="chips" id="fFreno"></div></div>
    <div class="fg"><span class="fg-label">Grupo</span><div class="chips" id="fGrupo"></div></div>
    <div class="fg"><span class="fg-label">Material</span><div class="chips" id="fMat"></div></div>
    <div class="fg"><span class="fg-label">Marca</span><div class="chips" id="fMarca"></div></div>
    <div class="fg"><span class="fg-label" id="lblPrecio">Precio pedido</span>
      <div class="pr"><input id="pMin" type="number" inputmode="numeric" placeholder="mín" min="0"><span>–</span><input id="pMax" type="number" inputmode="numeric" placeholder="máx" min="0"></div>
      <span class="fg-label" style="margin-top:6px">Fuente</span><div class="chips" id="fFuente"></div>
    </div>
    <div class="fg"><span class="fg-label">Mostrar</span>
      <div class="toggles">
        <label><input type="checkbox" id="oNuevas"> Sólo publicadas hace ≤ 3 días</label>
        <label><input type="checkbox" id="oBajada"> Sólo las que bajaron de precio</label>
        <label><input type="checkbox" id="o2019"> <span id="lblAnio">Sólo año reciente declarado</span></label>
        <label><input type="checkbox" id="oFav"> Sólo mis favoritas</label>
        <label><input type="checkbox" id="oReserv" checked> Incluir reservadas</label>
        <label><input type="checkbox" id="oViejas"> Incluir las que ya no aparecen</label>
      </div>
      <button class="btn" id="reset" style="margin-top:6px">Limpiar filtros</button>
    </div>
  </div>

  <div class="count-line" id="count" aria-live="polite"></div>
  <div id="results"></div>
  <div class="more" id="moreWrap"><button class="btn" id="more">Mostrar más</button></div>

  <div class="side">
    <div class="box">
      <h2>Cómo se arma esta lista</h2>
      <ul id="metodo"></ul>
    </div>
    <div class="box sold">
      <h2>Vendidas en los últimos días</h2>
      <ul id="vendidas"></ul>
    </div>
  </div>

  <div class="callout">
    <h2 id="consejosTitulo"></h2>
    <ul id="consejos"></ul>
  </div>
  <footer id="foot"></footer>
</div>

<div class="cmp" id="cmp" hidden role="dialog" aria-label="Comparar bicis">
  <div class="cmp-head"><h2>Comparar</h2><div style="display:flex;gap:8px"><button class="btn" id="clearCmp">Vaciar</button><button class="btn" id="closeCmp">Cerrar</button></div></div>
  <div class="cmp-body" id="cmpBody"></div>
</div>

  ? (GRUPO_TALLA[a.talla_letra] || 'Sin dato')
  : ({calza:'Calza', 'sin dato':'Sin dato', dudosa:'Dudosa', grande:'Grande'})[a.calce];
const OPC_TALLA = SIN_PREF_TALLA ? ['XS – S', 'M', 'L', 'XL o más', 'Sin dato'] : ['Calza', 'Sin dato', 'Dudosa', 'Grande'];
const TALLA_DEF = SIN_PREF_TALLA ? [] : ['Calza', 'Sin dato', 'Dudosa'];
A.forEach(a => {
  a._grupo = GRUPO(a); a._geo = GEO(a); a._freno = FRENO(a); a._mat = MAT(a); a._calce = CALCE(a);
  a._ratio = a.nuevo ? a.precio / a.nuevo : null;
  a._txt = [a.titulo, a.desc, a.marca, a.familia, a.grupo, a.freno, a.material, a.talla, a.ciudad, a._geo, a.anio].join(' ').toLowerCase();
  a._nuevaHoy = a.primera_vez === HOY;
});

// ------------------------------------------------------------------- estado
const F = {
  calce: new Set(store.get('f:calce', TALLA_DEF)),
  geo: new Set(), freno: new Set(), grupo: new Set(), mat: new Set(), marca: new Set(), fuente: new Set(),
};
let favs = new Set(store.get('favs', []));
let cmp = store.get('cmp', []).filter(id => A.some(a => a.id === id));
let vista = store.get('vista', 'cards');
let visibles = 48;
let orden = {k: 'puntaje', dir: -1};

function chips(el, key, valores){
  const cuenta = v => A.filter(a => valorDe(a, key) === v).length;
  el.innerHTML = valores.map(v => `<button class="chip" type="button" aria-pressed="${F[key].has(v)}" data-v="${esc(v)}">${esc(v)}<span class="n">${cuenta(v)}</span></button>`).join('');
  el.onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    const v = b.dataset.v;
    F[key].has(v) ? F[key].delete(v) : F[key].add(v);
    b.setAttribute('aria-pressed', F[key].has(v));
    if (key === 'calce') store.set('f:calce', [...F.calce]);
    visibles = 48; render();
  };
}
function valorDe(a, key){
  return {calce:a._calce, geo:a._geo, freno:a._freno, grupo:a._grupo, mat:a._mat, marca:a.marca || 'Sin marca', fuente:a.fuente}[key];
}
const masComunes = (key, n) => Object.entries(A.reduce((m, a) => (m[valorDe(a, key)] = (m[valorDe(a, key)] || 0) + 1, m), {}))
  .sort((x, y) => y[1] - x[1]).slice(0, n).map(x => x[0]);

chips($('#fCalce'), 'calce', OPC_TALLA);
chips($('#fGeo'), 'geo', ['Endurance', 'Carrera', 'Aero', 'Gravel', 'Triatlón', 'Sin dato']);
chips($('#fFreno'), 'freno', ['Disco', 'Llanta', 'Sin dato']);
chips($('#fGrupo'), 'grupo', ['Entrada', 'Tiagra / Apex', '105 / Rival', 'Ultegra o más', 'Sin dato']);
chips($('#fMat'), 'mat', ['Carbono', 'Aluminio', 'Acero', 'Titanio', 'Sin dato'].filter(v => A.some(a => a._mat === v)));
chips($('#fMarca'), 'marca', masComunes('marca', 18));
chips($('#fFuente'), 'fuente', masComunes('fuente', 5));

// ------------------------------------------------------------------ filtrado
function filtrar(){
  const q = $('#q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const pMin = +$('#pMin').value || 0, pMax = +$('#pMax').value || Infinity;
  const o = id => $(id).checked;
  return A.filter(a => {
    for (const k of ['calce', 'geo', 'freno', 'grupo', 'mat', 'marca', 'fuente'])
      if (F[k].size && !F[k].has(valorDe(a, k))) return false;
    if (a.precio < pMin || a.precio > pMax) return false;
    if (o('#oNuevas') && !(a.dias != null && a.dias <= 3)) return false;
    if (o('#oBajada') && !a.bajo) return false;
    if (o('#o2019') && !(a.anio >= PF.anio_min)) return false;
    if (o('#oFav') && !favs.has(a.id)) return false;
    if (!o('#oReserv') && a.estado === 'pendiente') return false;
    if (!o('#oViejas') && a.estado === 'no_visto') return false;
    return q.every(t => a._txt.includes(t));
  });
}
function ordenar(l){
  const k = $('#sort').value;
  const f = {
    puntaje: (x, y) => y.puntaje - x.puntaje,
    precio: (x, y) => x.precio - y.precio,
    '-precio': (x, y) => y.precio - x.precio,
    ratio: (x, y) => (x._ratio ?? 9) - (y._ratio ?? 9),
    dias: (x, y) => (x.dias ?? 999) - (y.dias ?? 999),
    bajada: (x, y) => ((y.antes || y.precio) - y.precio) - ((x.antes || x.precio) - x.precio),
  }[k];
  return l.sort(f);
}

// ------------------------------------------------------------------- render
function badgeCalce(a){
  const cls = SIN_PREF_TALLA ? '' : {calza:'ok', 'sin dato':'', dudosa:'mid', grande:'no'}[a.calce];
  const txt = a.talla ? `Talla ${a.talla}` : 'Talla sin dato';
  return `<span class="badge ${cls}" title="Equivalencia aproximada: ${esc(a.talla_letra || 'sin dato')}">${esc(txt)}</span>`;
}
function nuevoTxt(a){
  if (!a.nuevo) return '<div class="nuevo est">Precio nueva: sin datos suficientes para estimar</div>';
  const pct = Math.round(a.precio / a.nuevo * 100);
  const lbl = a.nuevo_origen === 'vendedor' ? 'nueva según el vendedor' : 'nueva (estimado)';
  return `<div class="nuevo" title="${esc(a.nuevo_texto)}">${a.nuevo_origen === 'vendedor' ? '' : '≈ '}<b>${aud(a.nuevo)}</b> ${lbl} · pide el <b>${pct}%</b></div>`;
}
function antiguedad(a){
  if (a.dias == null) return 'fecha sin dato';
  if (a.dias === 0) return 'publicada hoy';
  return `publicada hace ${a.dias} ${a.dias === 1 ? 'día' : 'días'}`;
}
function meta(a){
  const p = [];
  if (a.ciudad) p.push(esc(a.ciudad));
  p.push(antiguedad(a));
  p.push(esc(a.fuente));
  if (a.vendedor_n) p.push(`vendedor ★${a.vendedor_nota?.toFixed(1)} (${a.vendedor_n})`);
  if (a.condicion) p.push(esc(a.condicion));
  return p.map(x => `<span>${x}</span>`).join('');
}
function card(a){
  const sel = cmp.includes(a.id), fav = favs.has(a.id);
  const pills = [];
  if (a._nuevaHoy) pills.push('<span class="pill new">Nueva hoy</span>');
  if (a.bajo) pills.push('<span class="pill drop">Bajó de precio</span>');
  if (a.estado === 'pendiente') pills.push('<span class="pill res">Reservada</span>');
  if (a.estado === 'no_visto') pills.push(`<span class="pill">No aparece hace ${a.dias_visto} d</span>`);
  const bs = [badgeCalce(a), `<span class="badge">${esc(a._geo)}</span>`,
    `<span class="badge ${a._freno === 'Disco' ? 'ok' : ''}">${esc(a.freno || 'Freno sin dato')}</span>`];
  if (a.grupo) bs.push(`<span class="badge">${esc(a.grupo)}</span>`);
  if (a.material) bs.push(`<span class="badge">${esc(a.material)}</span>`);
  if (a.anio) bs.push(`<span class="badge ${a.anio >= 2019 ? 'ok' : ''}">${a.anio}</span>`);
  return `<article class="card ${sel ? 'sel' : ''}" data-id="${esc(a.id)}">
    <div class="ph">${a.foto ? `<img loading="lazy" src="${esc(url(a.foto))}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}<div class="none">sin foto</div>
      <div class="tl">${pills.join('')}</div>
      <div class="tr"><button class="icon-btn fav" aria-pressed="${fav}" title="Favorita" aria-label="Marcar favorita">${fav ? '★' : '☆'}</button></div>
    </div>
    <div class="body">
      <div class="row1"><div><div class="brand">${esc([a.marca, a.familia].filter(Boolean).join(' · ') || 'Marca sin dato')}</div><h3>${esc(a.titulo)}</h3></div>
        <div class="score" title="${esc(a.desglose.join('\n'))}"><b>${a.puntaje}</b><span>puntaje</span></div></div>
      <div class="price"><span class="v">${aud(a.precio)}</span>${a.antes ? `<s>${aud(a.antes)}</s>` : ''}</div>
      ${nuevoTxt(a)}
      <div class="badges">${bs.join('')}</div>
      <div class="meta">${meta(a)}</div>
      ${a.desc ? `<details class="desc"><summary>Ver descripción</summary><p>${esc(a.desc)}</p></details>` : ''}
      <div class="actions"><a href="${esc(url(a.url))}" target="_blank" rel="noopener">Abrir aviso ↗</a>
        <button class="cmpb" aria-pressed="${sel}">${sel ? 'En comparación' : 'Comparar'}</button></div>
    </div></article>`;
}
const COLS = [
  ['', null], ['', null], ['Bici', 'titulo'], ['Precio', 'precio', 'num'], ['Nueva ≈', 'nuevo', 'num'], ['%', '_ratio', 'num'],
  ['Talla', 'talla'], ['Geom.', '_geo'], ['Freno', '_freno'], ['Grupo', 'grupo'], ['Material', '_mat'], ['Año', 'anio', 'num'],
  ['Ciudad', 'ciudad'], ['Días', 'dias', 'num'], ['Fuente', 'fuente'], ['Puntaje', 'puntaje', 'num'],
];
function tabla(l){
  const h = COLS.map(([t, k, c]) => `<th class="${c || ''}" data-k="${k || ''}">${t}${orden.k === k ? (orden.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`).join('');
  const rows = l.map(a => {
    const sel = cmp.includes(a.id);
    return `<tr class="${sel ? 'sel' : ''}" data-id="${esc(a.id)}">
      <td><input type="checkbox" class="cmpc" ${sel ? 'checked' : ''} aria-label="Comparar"></td>
      <td>${a.foto ? `<img loading="lazy" src="${esc(url(a.foto))}" alt="" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">` : ''}</td>
      <td class="t"><a href="${esc(url(a.url))}" target="_blank" rel="noopener">${esc(a.titulo)}</a>${favs.has(a.id) ? ' ★' : ''}${a.bajo ? ' <span class="badge ok">bajó</span>' : ''}</td>
      <td class="num">${aud(a.precio)}</td><td class="num">${a.nuevo ? (a.nuevo_origen === 'vendedor' ? '' : '≈') + aud(a.nuevo) : '—'}</td>
      <td class="num">${a._ratio ? Math.round(a._ratio * 100) + '%' : '—'}</td>
      <td>${badgeCalce(a)}</td><td>${esc(a._geo)}</td><td>${esc(a.freno || '—')}</td><td>${esc(a.grupo || '—')}</td>
      <td>${esc(a._mat)}</td><td class="num">${a.anio || '—'}</td><td>${esc(a.ciudad || '')}</td>
      <td class="num">${a.dias ?? '—'}</td><td>${esc(a.fuente)}</td><td class="num"><b>${a.puntaje}</b></td></tr>`;
  }).join('');
  return `<div class="tablewrap"><table><thead><tr>${h}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function render(){
  let l = ordenar(filtrar());
  if (vista === 'table' && orden.k !== 'puntaje') {
    const k = orden.k;
    l = l.sort((x, y) => { const a = x[k] ?? (typeof y[k] === 'number' ? Infinity : ''), b = y[k] ?? (typeof x[k] === 'number' ? Infinity : ''); return (a > b ? 1 : a < b ? -1 : 0) * orden.dir; });
  }
  const calzan = l.filter(a => a.calce === 'calza').length;
  $('#count').textContent = `${l.length} de ${A.length} avisos · ${calzan} con talla que calza · ${l.filter(a => a._freno === 'Disco').length} con disco`;
  const res = $('#results');
  if (!l.length) { res.innerHTML = '<div class="empty">Ningún aviso calza con esta combinación. Prueba quitar algún filtro o buscar otra palabra.</div>'; $('#moreWrap').hidden = true; return; }
  const pagina = l.slice(0, visibles);
  res.innerHTML = vista === 'cards' ? `<div id="cards">${pagina.map(card).join('')}</div>` : tabla(pagina);
  $('#moreWrap').hidden = l.length <= visibles;
  $('#more').textContent = `Mostrar más (${l.length - visibles} restantes)`;
}

// ---------------------------------------------------------------- comparar
function toggleCmp(id){
  if (cmp.includes(id)) cmp = cmp.filter(x => x !== id);
  else { if (cmp.length >= 4) cmp.shift(); cmp.push(id); }
  store.set('cmp', cmp); actualizarCmp(); render();
}
function actualizarCmp(){
  const b = $('#openCmp'); b.textContent = `Comparar (${cmp.length})`; b.disabled = cmp.length < 1;
  if (!$('#cmp').hidden) dibujarCmp();
}
function dibujarCmp(){
  const l = cmp.map(id => A.find(a => a.id === id)).filter(Boolean);
  if (!l.length) { $('#cmpBody').innerHTML = '<p class="count-line">Marca "Comparar" en hasta 4 avisos.</p>'; return; }
  const min = f => Math.min(...l.map(f).filter(v => v != null));
  const max = f => Math.max(...l.map(f).filter(v => v != null));
  const filas = [
    ['', a => a.foto ? `<img src="${esc(url(a.foto))}" alt="" referrerpolicy="no-referrer">` : ''],
    ['Aviso', a => `<a href="${esc(url(a.url))}" target="_blank" rel="noopener">${esc(a.titulo)}</a>`],
    ['Precio', a => `<span class="${a.precio === min(x => x.precio) ? 'best' : ''}">${aud(a.precio)}</span>${a.antes ? ` <s>${aud(a.antes)}</s>` : ''}`],
    ['Nueva', a => a.nuevo ? `${a.nuevo_origen === 'vendedor' ? '' : '≈ '}${aud(a.nuevo)}<br><small>${esc(a.nuevo_texto)}</small>` : '—'],
    ['% de nueva', a => a._ratio ? `<span class="${a._ratio === min(x => x._ratio) ? 'best' : ''}">${Math.round(a._ratio * 100)}%</span>` : '—'],
    ['Puntaje', a => `<span class="${a.puntaje === max(x => x.puntaje) ? 'best' : ''}">${a.puntaje}</span><br><small>${a.desglose.map(esc).join('<br>')}</small>`],
    ['Talla', a => badgeCalce(a)], ['Geometría', a => esc(a._geo)], ['Freno', a => esc(a.freno || 'sin dato')],
    ['Grupo', a => esc(a.grupo || 'sin dato')], ['Material', a => esc(a._mat)], ['Año', a => a.anio || 'sin dato'],
    ['Ubicación', a => esc(a.ciudad || '')], ['Publicada', a => antiguedad(a)],
    ['Vendedor', a => a.vendedor_n ? `★${a.vendedor_nota?.toFixed(1)} (${a.vendedor_n} reseñas)` : esc(a.vendedor || '—')],
    ['Estado', a => esc(a.condicion || '—')], ['Fuente', a => esc(a.fuente)],
    ['', a => `<button class="btn" data-quitar="${esc(a.id)}">Quitar</button>`],
  ];
  $('#cmpBody').innerHTML = `<table>${filas.map(([t, f]) => `<tr><th>${t}</th>${l.map(a => `<td>${f(a)}</td>`).join('')}</tr>`).join('')}</table>`;
}

// ------------------------------------------------------------------ eventos
$('#results').addEventListener('click', e => {
  const host = e.target.closest('[data-id]'); if (!host) return;
  const id = host.dataset.id;
  if (e.target.closest('.cmpb') || e.target.closest('.cmpc')) { toggleCmp(id); return; }
  if (e.target.closest('.fav')) {
    favs.has(id) ? favs.delete(id) : favs.add(id); store.set('favs', [...favs]); render();
  }
});
$('#results').addEventListener('click', e => {
  const th = e.target.closest('th'); if (!th || !th.dataset.k) return;
  const k = th.dataset.k; orden = {k, dir: orden.k === k ? -orden.dir : (['precio', '_ratio', 'dias'].includes(k) ? 1 : -1)}; render();
});
['#q', '#pMin', '#pMax'].forEach(s => $(s).addEventListener('input', () => { visibles = 48; render(); }));
['#sort', '#oNuevas', '#oBajada', '#o2019', '#oFav', '#oReserv', '#oViejas'].forEach(s => $(s).addEventListener('change', () => { visibles = 48; orden = {k: 'puntaje', dir: -1}; render(); }));
$('#more').onclick = () => { visibles += 48; render(); };
function setVista(v){ vista = v; store.set('vista', v); $('#vCards').setAttribute('aria-pressed', v === 'cards'); $('#vTable').setAttribute('aria-pressed', v === 'table'); render(); }
$('#vCards').onclick = () => setVista('cards'); $('#vTable').onclick = () => setVista('table');
$('#tFilters').onclick = () => { const f = $('#filters'); f.hidden = !f.hidden; $('#tFilters').setAttribute('aria-expanded', !f.hidden); store.set('filtrosOcultos', f.hidden); };
$('#reset').onclick = () => {
  for (const k in F) F[k].clear(); TALLA_DEF.forEach(v => F.calce.add(v)); store.set('f:calce', [...F.calce]);
  document.querySelectorAll('.filters .chip').forEach(c => c.setAttribute('aria-pressed', F.calce.has(c.dataset.v) && c.closest('#fCalce') ? 'true' : 'false'));
  ['#q', '#pMin', '#pMax'].forEach(s => $(s).value = ''); ['#oNuevas', '#oBajada', '#o2019', '#oFav', '#oViejas'].forEach(s => $(s).checked = false); $('#oReserv').checked = true;
  visibles = 48; render();
};
$('#openCmp').onclick = () => { $('#cmp').hidden = false; dibujarCmp(); };
$('#closeCmp').onclick = () => { $('#cmp').hidden = true; };
$('#clearCmp').onclick = () => { cmp = []; store.set('cmp', cmp); actualizarCmp(); render(); };
$('#cmpBody').addEventListener('click', e => { const b = e.target.closest('[data-quitar]'); if (b) toggleCmp(b.dataset.quitar); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#cmp').hidden = true; });

// ---------------------------------------------------------- encabezado y pie
(function(){
  const c = D.corrida || {};
  const vig = A.filter(a => a.estado !== 'no_visto');
  const nuevasHoy = A.filter(a => a._nuevaHoy).length;
  const bajaron = A.filter(a => a.bajo).length;
  const disco = vig.filter(a => a._freno === 'Disco' && a.calce !== 'grande').length;
  const st = [[vig.length, 'Avisos vigentes']];
  if (PF.ideal) {
    st.push([vig.filter(a => a.precio <= PF.ideal).length, `Hasta ${aud(PF.ideal)} (ideal)`]);
    st.push([vig.filter(a => a.precio <= PF.presupuesto).length, `Hasta ${aud(PF.presupuesto)} (tope)`]);
  } else {
    st.push([vig.filter(a => a.calce === 'calza').length, 'Con talla que calza']);
  }
  st.push([disco, 'Con freno de disco'], [nuevasHoy, 'Nuevas desde ayer'], [bajaron, 'Bajaron de precio'],
    [fecha(HOY).slice(0, 5), 'Última actualización']);
  $('#stats').innerHTML = st.map(([n, l]) => `<div class="stat"><div class="num">${n}</div><div class="lbl">${esc(l)}</div></div>`).join('');
  $('#eyebrow').textContent = PF.eyebrow;
  $('#h1').textContent = PF.h1;
  $('#intro').textContent = PF.intro;
  $('#lblPrecio').textContent = `Precio pedido (${PF.moneda})`;
  $('#lblAnio').textContent = `Sólo año ${PF.anio_min}+ declarado`;
  $('#lblTalla').textContent = SIN_PREF_TALLA ? 'Talla declarada' : 'Talla (busca S / S-M / M)';
  const step = PF.moneda === 'CLP' ? 10000 : 50;
  $('#pMin').step = step; $('#pMax').step = step;
  const gumtree = D.gumtree_captura ? `captura del ${fecha(D.gumtree_captura)}, toda WA` : 'sin captura todavía';
  const presu = PF.ideal ? `tope de ${aud(PF.presupuesto)} e ideal de ${aud(PF.ideal)}` : `presupuesto de ${aud(PF.presupuesto)}`;
  const m = PF.fuentes_texto.map(t => t.replace('{n_busquedas}', c.n_busquedas ?? '—').replace('{fecha}', fecha(c.fecha)).replace('{gumtree}', gumtree)).concat([
    `<b>Talla, freno, grupo y año</b> salen del título y la descripción. Si el aviso no lo dice, aparece "sin dato": nunca se supone.`,
    `<b>Precio nueva</b>: si el vendedor lo dice (RRP, "costó", "pagué"), se usa eso. Si no, ≈ estimado según grupo, material y marca (precio de lista típico 2025-26 de una bici equivalente). Es una referencia para comparar, no un precio de lista real; pasa el mouse para ver en qué se basó.`,
    `<b>Puntaje</b> 0-100: geometría, frenos, grupo, material, año, ${presu} y precio contra nueva${SIN_PREF_TALLA ? ' (la talla no puntúa hasta saber la altura)' : ', con la talla como lo más importante'}. Pasa el mouse sobre el número para ver el desglose.`,
    `Un aviso que no aparece en 3 días queda oculto ("Incluir las que ya no aparecen"); sólo se declara vendido cuando la ficha lo dice.`,
  ]);
  $('#consejosTitulo').textContent = PF.consejos_titulo;
  $('#consejos').innerHTML = PF.consejos.map(x => `<li>${x}</li>`).join('');
  $('#metodo').innerHTML = m.map(x => `<li>${x}</li>`).join('');
  $('#vendidas').innerHTML = D.vendidas.length ? D.vendidas.map(v => `<li><s>${esc(v.titulo)}</s> · ${aud(v.precio)} · ${esc(v.fuente)}${v.fecha ? ' · ' + fecha(v.fecha) : ''}</li>`).join('') : '<li>Ninguna confirmada todavía.</li>';
  $('#foot').textContent = `Generado el ${fecha(HOY)}. Confirma siempre talla, año y estado con el vendedor antes de transferir dinero.`;
  if (store.get('filtrosOcultos', window.innerWidth < 700)) { $('#filters').hidden = true; $('#tFilters').setAttribute('aria-expanded', 'false'); }
})();
actualizarCmp();
setVista(vista);
</script>
</body>
</html>
